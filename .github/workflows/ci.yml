name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Correr tests
        run: npm test

      - name: Build de imagen Docker
        run: docker build -t myapp:ci-test .

  deploy:
    needs: test-and-build
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /home/vboxuser/myapp
          git pull origin main
          docker compose build
          docker compose up -d